[project]
name = "energy-intelligence"
version = "0.1.0"
description = "AI-powered energy analytics assistant combining RAG, multi-agent workflows, and real-world energy data."
readme = "README.md"
authors = [
    { email = "julien@vieillevigne.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "langchain-community==0.3.31",
    "langfuse>=4.7,<5",
    "langgraph>=1.2.18",
    "litellm>=1.106.4",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-google-genai>=0.6.0",
    "pgvector>=0.5.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=2.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
energy-intelligence = "energy_intelligence:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
