
services:
  energy-intelligence:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      ENERGY_API_URL: http://api:8000
      ENERGY_API_PUBLIC_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command:
      - uv
      - run
      - uvicorn
      - energy_intelligence.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
